# zizmor configuration — ignore rules for findings tracked in sub-issues
#
# Each entry here suppresses a known finding that is intentionally deferred
# to a tracked sub-issue of #92 (the zizmor audit umbrella). New occurrences
# of the same rule in different files or on different lines are NOT
# suppressed and will fail CI.
#
# Each group of ignores has a corresponding open issue that tracks the
# underlying fix. When a fix lands, remove the relevant ignore entries here.
#
# Rule reference: https://docs.zizmor.sh/audits/

rules: {}
