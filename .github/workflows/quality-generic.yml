name: Quality - Generic Subpackage

on:
  workflow_call:
    inputs:
      subpackage:
        required: true
        type: string
        description: "Path to subpackage (e.g., mellea_contribs/dspy_backend)"
      python_versions:
        required: false
        type: string
        description: "JSON array of Python versions (default: [\"3.11\", \"3.12\", \"3.13\"])"
      timeout_minutes:
        required: false
        type: number
        description: "Job timeout in minutes (default: 30)"
      skip_ollama:
        required: false
        type: boolean
        description: "Skip Ollama setup (default: false)"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref_name }}-${{ inputs.subpackage }}
  cancel-in-progress: true

env:
  CICD: 1

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes || 30 }}
    env:
      SUBPACKAGE: ${{ inputs.subpackage }}
    strategy:
      matrix:
        python-version: ${{ fromJson(inputs.python_versions || '["3.11", "3.12", "3.13"]') }}
      max-parallel: 1
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Free disk space
        uses: ./.github/actions/free-disk-space

      - name: Install Ollama (if needed)
        if: ${{ !inputs.skip_ollama }}
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
      - name: Start serving ollama (if needed)
        if: ${{ !inputs.skip_ollama }}
        run: |
          nohup ollama serve &

      - name: Install dependencies
        run: |
          cd "$SUBPACKAGE"
          if ! command -v uv &> /dev/null; then
            echo "Installing uv..."
            pip install uv
          fi
          echo "Setting up virtual environment and installing dependencies..."
          uv sync --all-extras

      # Pull exactly the models the tests request, derived from the *installed*
      # mellea rather than a hardcoded tag (see issue #94). Runs after `uv sync`
      # so mellea is importable; declared extras come from the package's
      # [tool.mellea-contribs.ci].ollama_models.
      - name: Pull required ollama models (if needed)
        if: ${{ !inputs.skip_ollama }}
        run: |
          set -euo pipefail
          cd "$SUBPACKAGE"
          # Resolve into a variable first: piping straight into the loop would
          # swallow a resolver failure (its exit status is lost, so a mellea
          # import error pulls nothing silently instead of failing the step).
          models=$(uv run python "$GITHUB_WORKSPACE/.github/scripts/resolve_ollama_models.py" resolve .)
          while read -r model; do
            [ -n "$model" ] && ollama pull "$model"
          done <<< "$models"

      - name: Run tests
        run: |
          cd "$SUBPACKAGE"
          echo "Running tests..."
          # Try multiple patterns to support both tests/ and test/ directories
          if [ -d "tests" ]; then
            uv run -- pytest -v tests/ --ignore=tests/integration
          elif [ -d "test" ]; then
            uv run -- pytest -v test/ --ignore=test/integration
          else
            echo "Error: No tests/ or test/ directory found"
            exit 1
          fi

      # Verify only the needed models were pulled (issue #94): fail if a test
      # downloaded something beyond the declared set. `always()` so it reports
      # even when the test step failed.
      - name: Validate pulled ollama models (if needed)
        if: ${{ always() && !inputs.skip_ollama }}
        run: |
          set -euo pipefail
          cd "$SUBPACKAGE"
          uv run python "$GITHUB_WORKSPACE/.github/scripts/resolve_ollama_models.py" validate .

      - name: Send failure message
        if: failure()
        run: echo "Tests failed for $SUBPACKAGE. Please verify that tests are working locally."
