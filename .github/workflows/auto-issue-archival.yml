name: auto-issue-archival

# Twice-weekly archival pass. Walks the bot's persistent state, advances the
# label-applied-days counter for each subpackage that still carries the
# `contribs-broken` label, and applies the day-7 reminder, day-14
# release-notes mention, and day-21 archival label.

"on":
  schedule:
    - cron: "0 8 * * 1,3"  # 08:00 UTC every Monday and Wednesday, ~45 minutes after smoke
  workflow_dispatch:

permissions:
  contents: write  # auto_issue_bot.py writes per-package state under .github/bot-state/
  issues: write

jobs:
  archival:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - name: Apply archival timeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          uv run python .github/scripts/auto_issue_bot.py --action apply-archival
