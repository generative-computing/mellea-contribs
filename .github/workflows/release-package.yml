name: Release Package

on:
  push:
    tags:
      - 'mellea-*/v[0-9]*'

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  # Workflow-level stays minimal; only the create-release job needs write.
  contents: read

env:
  CICD: 1

jobs:
  # This job dynamically discovers packages by reading their pyproject.toml files.
  # No need to modify this workflow when adding new packages - just ensure each
  # package has a pyproject.toml with a [project] name field in mellea_contribs/.
  parse-tag:
    runs-on: ubuntu-latest
    outputs:
      package_name: ${{ steps.parse.outputs.package_name }}
      version: ${{ steps.parse.outputs.version }}
      package_dir: ${{ steps.parse.outputs.package_dir }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Parse tag and discover package
        id: parse
        run: python3 .github/scripts/parse_release_tag.py

  build:
    needs: parse-tag
    uses: ./.github/workflows/build-package.yml
    with:
      package_dir: ${{ needs.parse-tag.outputs.package_dir }}
      package_name: ${{ needs.parse-tag.outputs.package_name }}
      version: ${{ needs.parse-tag.outputs.version }}

  create-release:
    needs: [parse-tag, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # creates the GitHub release with the built artifacts
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0  # Fetch all history for changelog generation
          persist-credentials: false

      - name: Download build artifacts
        env:
          PACKAGE_NAME: ${{ needs.parse-tag.outputs.package_name }}
          VERSION: ${{ needs.parse-tag.outputs.version }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.PACKAGE_NAME }}-${{ env.VERSION }}-dist
          path: dist

      - name: Generate release notes
        id: release-notes
        env:
          PACKAGE_NAME: ${{ needs.parse-tag.outputs.package_name }}
          VERSION: ${{ needs.parse-tag.outputs.version }}
          PACKAGE_DIR: ${{ needs.parse-tag.outputs.package_dir }}
        run: |
          TAG="${PACKAGE_NAME}/v${VERSION}"

          # Convert package name to wheel filename format (replace hyphens with underscores)
          # This follows PEP 503 normalization for wheel filenames
          WHEEL_NAME="${PACKAGE_NAME//-/_}"
          
          # Find previous tag for this package
          PREV_TAG=$(git tag -l "${PACKAGE_NAME}/v*" --sort=-version:refname | grep -v "^${TAG}$" | head -n 1 || echo "")
          
          echo "Current tag: $TAG"
          echo "Previous tag: $PREV_TAG"
          echo "Wheel filename: ${WHEEL_NAME}-${VERSION}-py3-none-any.whl"
          
          # Generate changelog
          CHANGELOG_FILE="release_notes.md"
          
          echo "# Release Notes for ${PACKAGE_NAME} v${VERSION}" > "$CHANGELOG_FILE"
          echo "" >> "$CHANGELOG_FILE"
          echo "## Installation" >> "$CHANGELOG_FILE"
          echo "" >> "$CHANGELOG_FILE"
          echo "Download the wheel file from the assets below and install with pip:" >> "$CHANGELOG_FILE"
          echo "" >> "$CHANGELOG_FILE"
          echo '```bash' >> "$CHANGELOG_FILE"
          echo "pip install ${WHEEL_NAME}-${VERSION}-py3-none-any.whl" >> "$CHANGELOG_FILE"
          echo '```' >> "$CHANGELOG_FILE"
          echo "" >> "$CHANGELOG_FILE"
          echo "Or install directly from the release:" >> "$CHANGELOG_FILE"
          echo "" >> "$CHANGELOG_FILE"
          echo '```bash' >> "$CHANGELOG_FILE"
          echo "pip install https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${WHEEL_NAME}-${VERSION}-py3-none-any.whl" >> "$CHANGELOG_FILE"
          echo '```' >> "$CHANGELOG_FILE"
          echo "" >> "$CHANGELOG_FILE"
          
          if [ -n "$PREV_TAG" ]; then
            echo "## Changes since ${PREV_TAG#*/v}" >> "$CHANGELOG_FILE"
            echo "" >> "$CHANGELOG_FILE"

            # Get commits affecting this package since previous tag
            COMMIT_COUNT=$(git log "${PREV_TAG}..${TAG}" --pretty=tformat:"- %s (%h)" -- "$PACKAGE_DIR" | tee -a "$CHANGELOG_FILE" | wc -l)

            # If no commits found in package dir, show all commits between tags
            if [ "$COMMIT_COUNT" -eq 0 ]; then
              echo "" >> "$CHANGELOG_FILE"
              echo "### All commits:" >> "$CHANGELOG_FILE"
              echo "" >> "$CHANGELOG_FILE"
              git log "${PREV_TAG}..${TAG}" --pretty=tformat:"- %s (%h)" >> "$CHANGELOG_FILE" || true
            fi
          else
            echo "## Initial Release" >> "$CHANGELOG_FILE"
            echo "" >> "$CHANGELOG_FILE"
            echo "This is the first release of ${PACKAGE_NAME}." >> "$CHANGELOG_FILE"
          fi
          
          echo "" >> "$CHANGELOG_FILE"
          echo "## Package Contents" >> "$CHANGELOG_FILE"
          echo "" >> "$CHANGELOG_FILE"
          echo "This release includes:" >> "$CHANGELOG_FILE"
          echo "- Wheel distribution (.whl)" >> "$CHANGELOG_FILE"
          echo "- Source distribution (.tar.gz)" >> "$CHANGELOG_FILE"
          
          cat "$CHANGELOG_FILE"
          echo "changelog_file=$CHANGELOG_FILE" >> "$GITHUB_OUTPUT"

      - name: Calculate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        env:
          PACKAGE_NAME: ${{ needs.parse-tag.outputs.package_name }}
          VERSION: ${{ needs.parse-tag.outputs.version }}
          CHANGELOG_FILE: ${{ steps.release-notes.outputs.changelog_file }}
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          tag_name: ${{ env.PACKAGE_NAME }}/v${{ env.VERSION }}
          name: ${{ env.PACKAGE_NAME }} v${{ env.VERSION }}
          body_path: ${{ env.CHANGELOG_FILE }}
          draft: false
          prerelease: ${{ contains(needs.parse-tag.outputs.version, '-') }}
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
          fail_on_unmatched_files: true

      - name: Release summary
        env:
          PACKAGE_NAME: ${{ needs.parse-tag.outputs.package_name }}
          VERSION: ${{ needs.parse-tag.outputs.version }}
        run: |
          # Convert package name to wheel filename format (replace hyphens with underscores)
          WHEEL_NAME="${PACKAGE_NAME//-/_}"

          echo "## Release Created Successfully! 🎉" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Package:** $PACKAGE_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "**Version:** $VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "**Tag:** ${PACKAGE_NAME}/v${VERSION}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Installation" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```bash' >> "$GITHUB_STEP_SUMMARY"
          echo "pip install https://github.com/${GITHUB_REPOSITORY}/releases/download/${PACKAGE_NAME}/v${VERSION}/${WHEEL_NAME}-${VERSION}-py3-none-any.whl" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Artifacts" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          ls -lh dist/ >> "$GITHUB_STEP_SUMMARY"
