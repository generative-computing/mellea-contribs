[project]
name = "mellea-contribs-systemone"
version = "0.1.0"
description = "Calibrated decision models (GLiNER2, Jev) as typed Mellea decision functions."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Shivdeep Singh" }]
keywords = ["mellea", "contribs", "gliner2", "jev", "ollama", "decisive", "judge"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["mellea>=0.7.0"]

[project.optional-dependencies]
jev     = ["typesafe-sdk>=0.7.1"]
ollama  = ["typesafe-sdk>=0.7.1"]
gliner2 = ["gliner2>=2.0.0"]
local   = ["gliner2[local]>=2.0.0"]
all     = ["typesafe-sdk>=0.7.1", "gliner2>=2.0.0"]

[project.urls]
Homepage   = "https://github.com/generative-computing/mellea"
Repository = "https://github.com/generative-computing/mellea-contribs"

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mellea_contribs"]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.mypy]
explicit_package_bases = true
ignore_errors           = true
ignore_missing_imports  = true

[tool.mellea-contribs.ci]
skip_ollama      = true
timeout_minutes  = 30
python_versions  = ["3.12"]

[tool.pytest.ini_options]
testpaths    = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: fast, hermetic — FakeJudge only, no network, no torch",
    "integration: requires gliner2[local] and ~74 MB checkpoint download",
    "e2e: requires TYPESAFE_API_KEY and live Jev API access",
]
