[project]
name = "mellea-contribs-acp"
version = "0.1.0"
description = "Mellea backend that drives m.instruct() and m.generate() through any ACP-compatible stdio agent (Bob, Mistral Vibe, …)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Xavier Vergés", email = "github@verg.es" }]
keywords = ["mellea", "contribs", "acp", "bob", "vibe", "mistral", "agent-client-protocol"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mellea>=0.8.0",
    "agent-client-protocol>=0.12.1",
]

[project.urls]
Homepage = "https://github.com/generative-computing/mellea"
Repository = "https://github.com/generative-computing/mellea-contribs"

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mellea_contribs"]

[tool.mellea-contribs.ci]
# Tests do not call start_session() — no local model needed.
skip_ollama = true
timeout_minutes = 10
python_versions = ["3.12"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
explicit_package_bases = true
ignore_errors = true
ignore_missing_imports = true
