[project]
name = "mellea-contribs-acp"
version = "0.1.0"
description = "Mellea backend that drives Bob via the Agent Client Protocol (ACP)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Mellea Contributor", email = "contributor@example.com" }]
keywords = ["mellea", "contribs", "acp", "bob"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mellea>=0.6.0",
    "agent-client-protocol>=0.12.1",
]

[project.optional-dependencies]
test = ["pytest>=7.0.0", "pytest-asyncio>=0.21.0"]

[dependency-groups]
dev = ["pytest>=7.0.0", "pytest-asyncio>=0.21.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mellea_contribs"]

[tool.mellea-contribs.ci]
# Tests do not call start_session() — no local model needed.
skip_ollama = true
timeout_minutes = 10
python_versions = ["3.12"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
explicit_package_bases = true
ignore_errors = true
ignore_missing_imports = true
